workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      vars:
        PACKAGE_NAME: "com.example.calllogapp"
    scripts:
      - name: Build APK
        script: |
          cd "$CM_BUILD_DIR"
          gradle assembleDebug
    artifacts:
      - app/build/outputs/**/**/*.apk
